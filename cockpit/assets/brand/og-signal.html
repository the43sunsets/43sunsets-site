<style>
:root{--paper:#F6F7F5;--ink:#20262E;--sub:#5A636E;--accent:#2F5D8A;}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--paper);}
.og{position:relative;width:1200px;height:630px;background:var(--paper) url(../hero/hero-a.webp) no-repeat; background-size:auto 118%; background-position:right -150px center;isolation:isolate;}

.in{position:absolute;inset:0;z-index:1;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;}
.lockup{height:112px;width:auto;display:block;align-self:flex-start;overflow:visible}

.lead{margin:18px 0 0;font-family:"Shippori Mincho",serif;font-weight:700;font-size:28px;color:var(--ink);letter-spacing:.06em}
.foot{display:flex;justify-content:space-between;align-items:flex-end;font-family:"Zen Kaku Gothic New",sans-serif;color:var(--sub);font-size:19px;letter-spacing:.02em}
.foot b{color:var(--ink);font-weight:500}
.rule{width:112px;height:3px;background:var(--ink);margin:0 0 26px}
