/* ---- health meter(ヘッダー右上・9/5) ---- */
.hb{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:4px 12px 4px 8px; font-size:11.5px; color:var(--sub); white-space:nowrap; cursor:help;}

.hb-dot{width:9px; height:9px; border-radius:50%; background:var(--line); flex:none; box-shadow:0 0 0 0 rgba(0,0,0,0);}
.hb.hb-ok .hb-dot{background:var(--fact); animation:hbpulse 2.4s ease-out infinite;} .hb.hb-ok{border-color:var(--fact);}
.hb.hb-wait .hb-dot{background:var(--infer);} .hb.hb-wait{border-color:var(--infer-line);}
.hb.hb-fail .hb-dot{background:var(--stamp);} .hb.hb-fail{border-color:var(--stamp); color:var(--stamp);} .hb.hb-fail .hb-k{color:var(--stamp);}

.kitem .ksum{font-size:13px; margin-top:6px; line-height:1.7;}
.kitem .kfact{font-size:12px; color:var(--sub); background:var(--fact-bg); border-left:3px solid var(--fact); padding:6px 10px; margin-top:8px; line-height:1.6; word-break:break-word;}
.kitem .kref{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--sub); margin-top:6px;}
.kitem .keq{font-size:13px; margin-top:6px;} .kitem .keq li{margin:2px 0;}
.kempty{font-size:13px; color:var(--sub); border:1px dashed var(--line); border-radius:6px; padding:12px 14px;}
.knote{font-size:11.5px; color:var(--sub); border-top:1px solid var(--line-soft); margin-top:28px; padding-top:10px; line-height:1.7;}
@media (max-width:760px){ .faces4{grid-template-columns:repeat(2,minmax(0,1fr));} .kwrap{padding:18px 16px 60px;} .kprof h2{font-size:20px;} }
</style>
</head>
<body>
<header>
  <div class="masthead">
    <div class="kicker"><a class="brandlink" href="/cockpit/">SIGNAL</a><span class="cock">by <a class="brandlink" href="https://43sunsets.com/">43 SUNSETS</a></span><a class="toplink" href="/cockpit/">← トップへ</a></div>
    <h1>企業カルテ</h1>
    <div class="meta" id="metaline">会社ごとに 4 面(建設許可・UCC・採用・政府補助金)の出来事を 1 枚に — 読み込み中…</div>
  </div>
  <div class="hdr-right"><button class="theme-btn" id="themebtn" type="button" aria-label="配色を切り替え">🌙 ダーク</button><div class="beta">BETA</div></div>
</header>
<script>
/* 配色スイッチ(cockpit 共通・既定 = ライト・選択は localStorage "cockpit-theme" に保存) */
(function(){
  const K = "cockpit-theme"; let t = null;
  try { t = localStorage.getItem(K); } catch (e) {}
  if (t !== "dark" && t !== "light") t = "light";
  const apply = n => { document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem(K, n); } catch (e) {}
    const b = document.getElementById("themebtn"); if (b) b.textContent = n === "dark" ? "☀️ ライト" : "🌙 ダーク";
    window.dispatchEvent(new CustomEvent("themechange", {detail: n})); };
  document.documentElement.setAttribute("data-theme", t);
  window.__setTheme = apply;
  const b = document.getElementById("themebtn");
  if (b) { b.textContent = t === "dark" ? "☀️ ライト" : "🌙 ダーク"; b.onclick = () => apply(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); }
})();
</script>
<main class="kwrap" id="main"><div class="kempty" id="loading">読み込み中…</div></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = v => v == null ? "" : (v >= 1e6 ? "$" + (v/1e6).toFixed(1) + "M" : "$" + Math.round(v/1e3) + "k");
function faceTile(href, label, n, sub, soon){ return `<a class="face4${soon ? " soon" : ""}" href="${href}"><div class="fl">${label}</div><div class="fn">${soon ? "Coming soon" : n}</div><div class="fs">${esc(sub)}</div></a>`; }
function permitItem(i){
  const cat = i.category === "未評価" ? `<span class="kchip">未評価(AI 読み待ち)</span>` : `<span class="kchip">${esc(i.category)}${i.confidence === "low" ? "・低確度" : ""}</span>`;
  return `<div class="kitem" id="${esc(i.id)}"><div class="khead"><span class="kdate">${esc(i.date || i.applied || "")}</span><span class="kloc">${esc(i.jurisdiction)}</span><span>${esc(i.address || "")}</span>${cat}<span class="kchip role">${esc(i.role_label)}</span>${i.value ? `<span class="kchip">工事費 ${usd(i.value)}</span>` : ""}</div>
    ${i.summary ? `<div class="ksum">${esc(i.summary)}</div>` : ""}${i.infer ? `<div class="ksum"><span class="badge-infer">推論</span>${esc(i.infer)}</div>` : ""}
    ${i.verbatim ? `<div class="kfact"><span class="badge-fact">事実</span>${esc(i.verbatim)}</div>` : ""}
    <div class="kref">${esc([i.permit_no ? "許可 " + i.permit_no : null, i.permit_type, i.source_id, i.id].filter(Boolean).join(" · "))}</div></div>`;
}
function uccItem(u){
  const eq = (u.equipment || []).map(e => `<li>${esc([e.type, e.maker, e.model].filter(Boolean).join(" · "))}${e.qty ? ` × ${esc(e.qty)}` : ""}${e.domain ? ` <span class="kchip">${esc(e.domain)}</span>` : ""}</li>`).join("");
  return `<div class="kitem" id="${esc(u.id)}"><div class="khead"><span class="kdate">${esc(u.date)}</span><span class="kloc">${esc(u.kind)}</span>${u.lender ? `<span class="kchip">${esc(u.lender)}</span>` : ""}<span class="kchip role">${esc(u.role_label)}</span>${u.status ? `<span class="kchip">${esc(u.status)}</span>` : ""}</div>
    ${eq ? `<ul class="keq">${eq}</ul>` : ""}${u.summary ? `<div class="ksum">${esc(u.summary)}</div>` : ""}${u.infer ? `<div class="ksum"><span class="badge-infer">推論</span>${esc(u.infer)}</div>` : ""}
    ${u.secured_party ? `<div class="kfact"><span class="badge-fact">事実</span>担保権者: ${esc(u.secured_party)}${u.lapse ? ` · 失効 ${esc(u.lapse)}` : ""}</div>` : ""}
    <div class="kref">${esc([u.ref, u.id].filter(Boolean).join(" · "))}</div></div>`;
}
function render(c){
  document.title = `${c.name} — 企業カルテ | Signal by 43 Sunsets`;
  const f = c.faces; const jp = c.jp ? `<span class="chip jp">日系(${c.jp_basis === "roster" ? "名簿" : "人の確認"})</span>` : (c.jp_candidate ? `<span class="chip">日系?(AI 候補)</span>` : "");
  document.getElementById("metaline").innerHTML = `${esc(c.name)} · 建設許可 <span class="mono">${f.permits.count}</span> 件 · UCC 登記 <span class="mono">${f.ucc.count}</span> 件 · 書き出し <span class="mono">${esc((c.generated_at || "").slice(0,10))}</span>`;
  const back = document.referrer && /43sunsets\.com\/cockpit\//.test(document.referrer) ? `<a href="javascript:history.back()">‹ 戻る</a>` : "";
  document.getElementById("main").innerHTML = `
    <div class="kprof"><div><div class="kicker">SIGNAL by 43 SUNSETS — COMPANY KARTE(BETA)</div><h2>${esc(c.name)}</h2>
      <div class="ksub">${esc([c.city, c.state].filter(Boolean).join(", "))} ${jp} ${c.industry ? `<span class="chip">${esc(c.industry)}</span>` : ""}</div>
      <div class="ksub" style="margin-top:6px">${c.made ? esc(c.made) + " · " : ""}${c.size ? "規模 " + esc(c.size) + " · " : ""}${c.website ? `<a href="${esc(c.website)}" target="_blank" rel="noopener">${esc(c.website)}</a>` : "サイト —"}${c.master_checked_at ? ` · 会社マスター調査 ${esc(c.master_checked_at)}` : " · 会社マスター未調査"}</div></div>
      <div class="kback">${back}</div></div>
    <div class="faces4">
      ${faceTile("#permits", "建設許可", f.permits.count + " 件", f.permits.count ? (f.permits.value_total ? "工事費 合計 " + usd(f.permits.value_total) : "最新 " + (f.permits.latest || "")) : "当社の網に無い", false)}
      ${faceTile("#ucc", "UCC 登記", f.ucc.count + " 件", f.ucc.count ? "機械 " + f.ucc.machines + " 台 · " + (f.ucc.makers || []).join("・") : "当社の網に無い", false)}
      ${faceTile("#hiring", "採用", "", "開発中", true)}
      ${faceTile("#grants", "政府補助金", "", "開発中", true)}
    </div>
    <section class="ksec" id="permits"><h3>建設許可(${f.permits.count})</h3>${f.permits.items.length ? f.permits.items.map(permitItem).join("") : `<div class="kempty">この会社の建設許可は当社の網に無い(未収集の自治体か、名義が別会社)。</div>`}</section>
    <section class="ksec" id="ucc"><h3>UCC 登記(${f.ucc.count})</h3>${f.ucc.items.length ? f.ucc.items.map(uccItem).join("") : `<div class="kempty">この会社の UCC 登記は当社の網に無い(オハイオ先行・担保権者名で検索した範囲)。</div>`}</section>
    <section class="ksec" id="hiring"><h3>採用</h3><div class="kempty">${esc(f.hiring.note)}</div></section>
    <section class="ksec" id="grants"><h3>政府補助金</h3><div class="kempty">${esc(f.grants.note)}</div></section>
    <section class="ksec"><h3>時系列(4 面を合流)</h3><div class="timeline">${(c.timeline || []).map(t => `<div class="tl-item ${t.face === "ucc" ? "ucc" : "permit"}"><div class="tl-date">${esc(t.date)}</div><div class="tl-title"><a href="#${esc(t.ref)}">${esc(t.title)}</a></div><div class="tl-body">${esc(t.summary || "")}</div></div>`).join("") || `<div class="kempty">出来事なし</div>`}</div></section>
    <div class="knote">${esc(c.note)}</div>`;
}
async function boot(){
  const id = new URLSearchParams(location.search).get("id") || "";
  const main = document.getElementById("main");
  if(!/^C-\d+$/.test(id)){ main.innerHTML = `<div class="kempty">会社 ID が指定されていません。検出面(<a href="/cockpit/permits/">建設許可</a>・<a href="/cockpit/ucc/">UCC</a>)の社名から開いてください。</div>`; document.getElementById("metaline").textContent = "会社 ID なし"; return; }
  try{
    const r = await fetch(`../data/companies/${id}.json`, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  }catch(err){ main.innerHTML = `<div class="kempty">このカルテ(${esc(id)})は見つかりません(${esc(err.message)})。会社マスターの更新で ID が変わった可能性があります。検出面から開き直してください。</div>`; document.getElementById("metaline").textContent = "見つかりません"; }
}
boot();
</script>

</body>
</html>
